var ids=new Set(existing.map(function(l){return String(l.id)}));
cleanItems.forEach(function(l){if(!ids.has(String(l.id))){existing.push(l);ids.add(String(l.id))}});
S.live=existing;S.up[w.k]=Date.now();
sv("fr_live",S.live);sv("fr_up",S.up);
added+=cleanItems.length;success++;
}
async function worker(){
while(next<tasks.length){
var w=tasks[next++];active++;progress();
try{await runOne(w)}catch(e){var reason=em(e);failed.push(w.k+": "+reason);logEvent("scan_error",{keyword:w.k,message:reason});S.scanStats.push({k:w.k,error:reason.slice(0,140)})}
active--;done++;progress();
}
}
try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}
try{await Promise.all([worker(),worker()].slice(0,Math.min(2,tasks.length)))}
finally{
S.busy=0;S.scanDone=done;try{if(wl)wl.release()}catch(e){}
var elapsed=Math.floor((Date.now()-started)/1000);
var report=null;try{report=buildScanReport({results:scanResults,attempted:tasks.length,completed:success,failed:failed.length,seconds:elapsed,slowest:slowest,hiddenSec:Math.round((hiddenMs()-hid0)/1000),radius:scanRadius,sortBy:scanSort,strict:!!S.strict,center:scanCenter});S.scanReport=report;sv("fr_scan_report",report);S.kwHist=FRDiscovery.recordScan(S.kwHist,FRDiscovery.computeYield(scanResults.map(function(r){return {k:r.k,raw:r.raw,listings:r.listings.map(function(l){return {id:l.id,local:isB(l),device:l.cls==="device"&&l.g==="Phones"}})}})));sv("fr_kwhist",S.kwHist)}catch(reportError){logEvent("scan_error",{message:"Report failed: "+String(reportError&&reportError.message||reportError)})}
sv("fr_scan_stats",S.scanStats);
say("Finished "+success+"/"+tasks.length+" searches in "+elapsed+"s. "+added+" clean listings loaded."+(failed.length?" "+failed.length+" failed; successful results were saved. "+failed.join(" | ").slice(0,450):""));logEvent("scan_finished",{keywords:tasks.map(function(t){return t.k}),seconds:elapsed,succeeded:success,failed:failed.length,cleaned:added,stats:S.scanStats,report:report,filters:filterAudit()});
R();
}
}

// Load all 48 Bohol municipality representative coordinates from the checked-in dataset.
fetch("./bohol-geography.json").then(function(r){if(!r.ok)throw Error("Geography HTTP "+r.status);return r.json()}).then(function(data){if(!data||!Array.isArray(data.municipalities)||data.municipalities.length!==48)throw Error("Expected 48 Bohol locations");data.municipalities.forEach(function(m){if(!m.name||!Number.isFinite(m.lat)||!Number.isFinite(m.lon))return;var name=normTown(m.name)==="tagbilaran"?"Tagbilaran":m.name;TOWNS[name]=[m.lat,m.lon];TOWN_PROVINCE[name]="Bohol"});logEvent("geography_loaded",{municipalities:data.municipalities.length});R()}).catch(function(e){logEvent("geography_error",{message:String(e.message||e)});});
R();
