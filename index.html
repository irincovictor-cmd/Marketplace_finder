if(bm)r=r.filter(function(x){return pr(x)<=bm});
return r.map(function(x){var g=gs[gk(x.marketplace_listing_title)],c=gv(x,"location.reverse_geocode.city")||"",st=gv(x,"location.reverse_geocode.state")||"";return{id:"f"+x.id,t:x.marketplace_listing_title,k:k,p:pr(x),c:c,h:Math.max(0,Math.floor((now-x.creation_time)/3600)),g:cg(x.marketplace_listing_title),province:st,u:x.listingUrl,i:x.primary_listing_photo_url,s:g.length>=4?q3(g):s,n:g.length,w:g.length<5,b:/bohol/i.test(st)||BO.indexOf(c)>-1}})}

}catch(e){var msg=String(e.message||e).replace(/apify_api_[A-Za-z0-9_-]+/g,"[REDACTED]");logEvent("category_test_error",{message:msg});if(el)el.textContent="Category test failed: "+msg.slice(0,230)+". Your saved listings are unchanged."}

var tasks=ws.filter(function(w){return w&&w.k}).map(function(w){return{k:String(w.k),max:w.max}});
var scanProvince=S.province=="All"?"Bohol":S.province;
var refPoint=TOWNS[S.nearTown];var scanCenter=refPoint?{lat:refPoint[0],lon:refPoint[1]}:(LOCS[scanProvince]||LOCS.Bohol);
var scanRadius=S.radius;
if(!tasks.length)return;
logEvent("scan_started",{keywords:tasks.map(function(t){return t.k}),maxPrice:bm||null,province:S.province,referenceTown:S.nearTown,radiusKm:scanRadius,coordinates:scanCenter});S.busy=1;S.scanTotal=tasks.length;S.scanDone=0;S.scanStats=[];
R();

function progress(){
var elapsed=Math.floor((Date.now()-started)/1000);

async function runOne(w){
var r=await fetch("https://api.apify.com/v2/acts/curious_coder~facebook-marketplace/run-sync-get-dataset-items?clean=true&limit=60&token="+encodeURIComponent(S.tok),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({searchKeyword:w.k,latitude:scanCenter.lat,longitude:scanCenter.lon,radiusKm:scanRadius,daysSinceListed:"7",sortBy:"creation_time_descend",maxPagesPerUrl:1,getListingDetails:false,getAllListingPhotos:false,proxy:{useApifyProxy:true,apifyProxyCountry:"PH"}})});
if(r.status==401||r.status==403)throw{code:"bad_token"};
if(!r.ok){var detail="";try{var errorBody=await r.text();try{var errorJson=JSON.parse(errorBody);detail=(errorJson.error&&(errorJson.error.message||errorJson.error.type))||errorJson.message||errorJson.detail||""}catch(parseError){detail=errorBody}}catch(readError){}detail=String(detail).replace(/apify_api_[A-Za-z0-9_-]+/g,"[redacted]").slice(0,200);throw{code:"http_"+r.status,detail:detail}}
var items=await r.json();
var rawItems=Array.isArray(items)?items:[];
var cleanItems=clean(rawItems,w.k,bm);
S.scanStats.push({k:w.k,raw:rawItems.length,cleaned:cleanItems.length,bohol:cleanItems.filter(isB).length});logEvent("keyword_result",{keyword:w.k,raw:rawItems.length,cleaned:cleanItems.length,boholRecognized:cleanItems.filter(isB).length,locationSamples:cleanItems.slice(0,12).map(function(l){return {title:l.t,city:l.c,state:l.province,interpretedProvince:locName(l),distanceKm:Number.isFinite(distanceFromRef(l))?Math.round(distanceFromRef(l)):null}})});
var existing=S.live.filter(function(l){return l.k!==w.k});
var ids=new Set(existing.map(function(l){return String(l.id)}));
cleanItems.forEach(function(l){if(!ids.has(String(l.id))){existing.push(l);ids.add(String(l.id))}});
S.live=existing;S.up[w.k]=Date.now();
sv("fr_live",S.live);sv("fr_up",S.up);
added+=cleanItems.length;success++;
}
async function worker(){
while(next<tasks.length){
var w=tasks[next++];active++;progress();
try{await runOne(w)}catch(e){var reason=em(e);failed.push(w.k+": "+reason);logEvent("scan_error",{keyword:w.k,message:reason});S.scanStats.push({k:w.k,error:reason.slice(0,140)})}
active--;done++;progress();
}
}
try{await Promise.all([worker(),worker()].slice(0,Math.min(2,tasks.length)))}
finally{
S.busy=0;S.scanDone=done;
var elapsed=Math.floor((Date.now()-started)/1000);
sv("fr_scan_stats",S.scanStats);
say("Finished "+success+"/"+tasks.length+" searches in "+elapsed+"s. "+added+" clean listings loaded."+(failed.length?" "+failed.length+" failed; successful results were saved. "+failed.join(" | ").slice(0,450):""));logEvent("scan_finished",{keywords:tasks.map(function(t){return t.k}),seconds:elapsed,succeeded:success,failed:failed.length,cleaned:added,stats:S.scanStats,filters:filterAudit()});
R();
}
}
